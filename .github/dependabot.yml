version: 2
updates:
  # GitHub Actions are SHA-pinned (see workflows). Dependabot keeps the
  # pins current with PRs that bump SHA + version-comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Python deps are declared in pyproject.toml. No lockfile is committed,
  # so Dependabot's pip ecosystem reads pyproject directly and opens one
  # PR per outdated direct dependency (transitive pins are not tracked).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
