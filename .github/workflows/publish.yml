name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Guard release tag matches built version
        # skip-existing below silently no-ops a re-publish of an already-present
        # version, so a forgotten version bump would ship a release tag with no
        # new package and no error. Fail loudly when the tag and the built
        # version disagree, before publish. The wheel name comes from pyproject
        # alone, so __version__ is compared separately: it is stamped into signed
        # export bundles, which cannot be corrected once written.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL="$(ls dist/*.whl | head -1)"
          BUILT="$(basename "$WHEEL" | sed -E 's/^mareforma-([^-]+)-.*/\1/')"
          INIT="$(sed -nE 's/^__version__ = "(.+)"$/\1/p' mareforma/__init__.py)"
          echo "release tag=$TAG  built version=$BUILT  __version__=$INIT"
          if [ "$TAG" != "$BUILT" ] || [ "$TAG" != "$INIT" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (version $TAG) does not match the built version $BUILT and __version__ $INIT. Bump pyproject.toml and mareforma/__init__.py before tagging."
            exit 1
          fi

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish release/v1 — pinned 2026-05-12
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
