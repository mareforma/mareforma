name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Guard release tag matches built version
        # skip-existing below silently no-ops a re-publish of an already-present
        # version, so a forgotten version bump would ship a release tag with no
        # new package and no error. Fail loudly when the tag and the built
        # version disagree, before publish.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL="$(ls dist/*.whl | head -1)"
          BUILT="$(basename "$WHEEL" | sed -E 's/^mareforma-([^-]+)-.*/\1/')"
          echo "release tag=$TAG  built version=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (version $TAG) does not match the built version $BUILT. Bump pyproject.toml and mareforma/__init__.py before tagging."
            exit 1
          fi

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish release/v1 — pinned 2026-05-12
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true
