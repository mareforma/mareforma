[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mareforma"
version = "0.3.10"
description = "Epistemic infrastructure for AI scientists"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["epistemic-graph", "ai-scientists", "provenance", "reproducibility", "multi-agent", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
    "cryptography>=42",
    "rfc8785>=0.1",
]

[project.urls]
Homepage = "https://github.com/mareforma/mareforma"
Documentation = "https://docs.mareforma.com"
Repository = "https://github.com/mareforma/mareforma"
Issues = "https://github.com/mareforma/mareforma/issues"

[project.optional-dependencies]
# Adapter extras. Each names the platform-specific runtime deps the
# adapter needs. mareforma core stays slim; users opt into the
# platforms they actually integrate with.
clawinstitute = []  # httpx is already a core dep
tooluniverse = []   # rfc8785 is already a core dep
gemini = []          # read-only ingest, no platform SDK
# Chemistry forms. rdkit-canonical-smiles-v1 refuses without rdkit
# rather than substituting the string form under the same name.
chem = ["rdkit>=2023.3"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-httpx>=0.36.2",
    # the packaging guard builds the sdist in-process with the build backend,
    # and pip no longer seeds setuptools into a venv. Matches the build floor.
    "setuptools>=77",
]
# Heavy scientific + networking loaders exercised by the grounding tests. Gated
# behind an extra so the default dev install stays fast and the main matrix does
# not carry native wheels that may not build on every Python; the grounding
# tests skip these paths when the libs are absent (pytest.importorskip). Run on
# ONE pinned CI leg (see the test-heavy job). HTTP tests mock with
# responses / pytest-httpx, never live network.
test-heavy = [
    "h5py>=3.8",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "responses>=0.24",
]

[project.scripts]
mareforma = "mareforma.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mareforma*"]

[tool.setuptools.package-data]
# PEP 561: ship the py.typed marker inside the wheel so downstream
# type-checkers (mypy / pyright) honour mareforma's annotations
# instead of treating every symbol as Any.
mareforma = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not sdist'"
markers = [
    "adapters: tests exercising the mareforma.adapters.* namespace",
    "sdist: builds an sdist and runs the shipped suite inside it (~45s)",
]

[tool.coverage.run]
source = ["mareforma"]
omit = ["tests/*"]