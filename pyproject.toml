[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mareforma"
version = "0.3.12"
description = "Local verification layer for AI-assisted research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["epistemic-graph", "ai-scientists", "provenance", "reproducibility", "multi-agent", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.1",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
    "cryptography>=42",
    "rfc8785>=0.1",
]

[project.urls]
Homepage = "https://github.com/mareforma/mareforma"
Documentation = "https://docs.mareforma.com"
Repository = "https://github.com/mareforma/mareforma"
Issues = "https://github.com/mareforma/mareforma/issues"

[project.optional-dependencies]
# No adapter extras. Every adapter runs on core deps, so an extra per
# adapter would install nothing and still succeed, reading as "already
# satisfied" to anyone who ran it. Adapters are opt-in by import.
# Chemistry forms. rdkit-canonical-smiles-v1 refuses without rdkit
# rather than substituting the string form under the same name.
chem = ["rdkit>=2023.3"]
# Model Context Protocol server (`mareforma mcp serve`), read and verify only.
# Opt-in because the SDK is heavy for a package whose pitch is six light runtime
# deps. `mcp` requires anyio, httpx2, jsonschema, mcp-types, opentelemetry-api,
# pydantic, pyjwt, python-multipart, sse-starlette, starlette, typing-extensions,
# typing-inspection and uvicorn, which is 40 packages installed against 20
# without it. The base `pip install mareforma` is unchanged; the server module
# imports only under this extra.
# Pinned below 3: the server calls `mcp.server.MCPServer`, `add_tool` and
# `run(transport=)`, which is a 2.x API. The SDK already renamed this class
# across one major bump, and a PyPI artefact cannot be corrected after the
# fact, so an unbounded range would let a future 3.x break the import at
# runtime for anyone installing this release.
mcp = ["mcp>=2.0,<3"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-httpx>=0.36.2",
    # the packaging guard builds the sdist in-process with the build backend,
    # and pip no longer seeds setuptools into a venv. Matches the build floor.
    "setuptools>=77",
]
# Heavy scientific + networking loaders exercised by the grounding tests. Gated
# behind an extra so the default dev install stays fast and the main matrix does
# not carry native wheels that may not build on every Python; the grounding
# tests skip these paths when the libs are absent (pytest.importorskip). Run on
# ONE pinned CI leg (see the test-heavy job). HTTP tests mock with
# responses / pytest-httpx, never live network.
test-heavy = [
    "h5py>=3.8",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "responses>=0.24",
]

[project.scripts]
mareforma = "mareforma.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mareforma*"]

[tool.setuptools.package-data]
# PEP 561: ship the py.typed marker inside the wheel so downstream
# type-checkers (mypy / pyright) honour mareforma's annotations
# instead of treating every symbol as Any.
mareforma = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -m 'not sdist'"
filterwarnings = [
    # The seed-anchor deprecation fires on ~180 seed=True call sites across the
    # suite, most of them incidental scaffolding for tests about something else.
    # Ignore it suite-wide, scoped by message and category so nothing else is
    # touched. A blanket `error` is a trust-root defect: it would raise on the
    # irrevocable root-enrollment notice (validators.py) before its stderr
    # fallback runs. That the warning actually fires is proved by
    # tests/test_seed_deprecation.py, which escalates this exact message to an
    # error locally rather than suite-wide.
    'ignore:assert_claim\(seed=True\) is deprecated:DeprecationWarning',
    # Same treatment, same reason: the support-ladder retirement now warns on
    # query(min_support=...), the path real callers take, and ~40 suite call
    # sites pass it as scaffolding for tests about something else. It is proved
    # to fire in tests/test_min_support_deprecation.py.
    'ignore:query\(min_support=\.\.\.\) is deprecated:DeprecationWarning',
]
markers = [
    "adapters: tests exercising the mareforma.adapters.* namespace",
    "sdist: builds an sdist and runs the shipped suite inside it (~45s)",
]

[tool.coverage.run]
source = ["mareforma"]
omit = ["tests/*"]